# Preliminar Semana 1: solo Kafka (KRaft, un nodo) + creación del topic.
# Spark y Airflow se agregan en las Semanas 2 y 3.
services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: coldchain-kafka
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_HOST://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3

  kafka-init:
    image: apache/kafka:3.8.0
    container_name: coldchain-kafka-init
    depends_on:
      - kafka
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        for i in $$(seq 1 30); do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1 && break
          sleep 2
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
          --topic rapidgo.coldchain.readings --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --describe --topic rapidgo.coldchain.readings
  spark-streaming:
    image: apache/spark:3.5.1-python3
    container_name: coldchain-spark-streaming
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    entrypoint: ["/opt/spark/bin/spark-submit"]
    command:
      - "--master"
      - "local[*]"
      - "--conf"
      - "spark.jars.ivy=/tmp/.ivy2"
      - "--packages"
      - "org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1"
      - "/opt/spark/app/streaming.py"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: rapidgo.coldchain.readings
      KAFKA_STARTING_OFFSETS: earliest
      DATALAKE_PATH: /opt/rapidgo/datalake
    volumes:
      - ./spark:/opt/spark/app:ro
      - ./datalake:/opt/rapidgo/datalake